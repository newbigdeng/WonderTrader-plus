<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img"><title>两种回测，共用策略接口</title><rect width="1100" height="590" fill="#fff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555" /></marker></defs><text x="35" y="43" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="26" font-weight="600" fill="#222">两种回测，共用策略接口</text><text x="35" y="105" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="600" fill="#222">快速回测</text><rect x="35.0" y="127" width="238.75" height="89" rx="6" fill="#f6f6f6" stroke="#999" /><text x="47.0" y="163" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="600" fill="#222">历史行情</text><text x="47.0" y="193" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">HisDataReplayer</text><line x1="276.75" y1="171" x2="295.75" y2="171" stroke="#555" stroke-width="2" marker-end="url(#arrow)" /><rect x="298.75" y="127" width="238.75" height="89" rx="6" fill="#f6f6f6" stroke="#999" /><text x="310.75" y="163" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="600" fill="#222">策略与 Mocker</text><text x="310.75" y="193" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">CTA / HFT / SEL</text><line x1="540.5" y1="171" x2="559.5" y2="171" stroke="#555" stroke-width="2" marker-end="url(#arrow)" /><rect x="562.5" y="127" width="238.75" height="89" rx="6" fill="#f6f6f6" stroke="#999" /><text x="574.5" y="163" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="600" fill="#222">成交规则</text><text x="574.5" y="193" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">CTA 可选三种模型</text><line x1="804.25" y1="171" x2="823.25" y2="171" stroke="#555" stroke-width="2" marker-end="url(#arrow)" /><rect x="826.25" y="127" width="238.75" height="89" rx="6" fill="#f6f6f6" stroke="#999" /><text x="838.25" y="163" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="600" fill="#222">回测结果</text><text x="838.25" y="193" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">仓位 / 费用 / 盈亏</text><text x="35" y="249" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400" fill="#222">快速路径用于验证信号与成交假设。</text><text x="35" y="310" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="600" fill="#222">Plus 回测 · CTA</text><rect x="35.0" y="332" width="186.0" height="89" rx="6" fill="#f6f6f6" stroke="#999" /><text x="47.0" y="368" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="600" fill="#222">历史 Tick 回放</text><text x="47.0" y="398" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">按历史时钟驱动</text><line x1="224.0" y1="376" x2="243.0" y2="376" stroke="#555" stroke-width="2" marker-end="url(#arrow)" /><rect x="246.0" y="332" width="186.0" height="89" rx="6" fill="#f6f6f6" stroke="#999" /><text x="258.0" y="368" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="600" fill="#222">实盘引擎与策略</text><text x="258.0" y="398" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">WtEngine / CTA</text><line x1="435.0" y1="376" x2="454.0" y2="376" stroke="#555" stroke-width="2" marker-end="url(#arrow)" /><rect x="457.0" y="332" width="186.0" height="89" rx="6" fill="#f6f6f6" stroke="#999" /><text x="469.0" y="368" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="600" fill="#222">真实执行器</text><text x="469.0" y="398" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">MinImpact / TWAP / VWAP</text><line x1="646.0" y1="376" x2="665.0" y2="376" stroke="#555" stroke-width="2" marker-end="url(#arrow)" /><rect x="668.0" y="332" width="186.0" height="89" rx="6" fill="#f6f6f6" stroke="#999" /><text x="680.0" y="368" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="600" fill="#222">TraderAdapter</text><text x="680.0" y="398" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">委托与回报</text><line x1="857.0" y1="376" x2="876.0" y2="376" stroke="#555" stroke-width="2" marker-end="url(#arrow)" /><rect x="879.0" y="332" width="186.0" height="89" rx="6" fill="#f6f6f6" stroke="#999" /><text x="891.0" y="368" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="600" fill="#222">TraderMocker</text><text x="891.0" y="398" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">成交 / 费用 / 资金</text><text x="35" y="454" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400" fill="#222">回报返回执行器与策略；HFT 直接管理委托，不经过 CTA 执行器。</text><text x="35" y="556" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400" fill="#222">模拟柜台不连接 CTP；VWAP 使用事先给定的权重曲线。</text></svg>